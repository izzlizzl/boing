<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boing</title>
<meta name="description" content="A calm daily home workout: one strength routine plus a movement skill of the day.">
<meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one calm phone column (Today / Progress / Settings) and a full-screen player with a big colour-tinted stage */
:root{
  --bg:#F6F6F3; --card:#FFFFFF; --ink:#16161D; --muted:#6B6B77; --line:#E6E6EB; --soft:#EEEEF1;
  --fig:#23232D; --fig2:#9A9AA6; --prop:#DADAE1;
  --btn:#16161D; --btn-ink:#FFFFFF;
  --c-warm:#FF7A45; --c-cool:#7C5CFF;
  --good:#12A27A; --warn:#C77700;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111115; --card:#1B1B21; --ink:#F2F2F5; --muted:#9D9DA9; --line:#2B2B34; --soft:#23232B;
  --fig:#EEEEF3; --fig2:#6E6E7B; --prop:#383843;
  --btn:#F2F2F5; --btn-ink:#16161D; --good:#3FD6A6; --warn:#F5B94A;
  color-scheme:dark}}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.app{max-width:560px;margin:0 auto;padding-inline:20px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.label{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.display{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em}
section+section{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;font-weight:600;font-size:.86rem;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

/* today */
.hello{display:grid;gap:10px;margin-bottom:22px}
.hello h1{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.035em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:26px}
.wd{display:grid;justify-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal}
.wd i.done{background:var(--c,var(--ink));border-color:transparent}
.wd i.done svg{width:15px;height:15px;color:#fff}
.wd.today{color:var(--ink)}
.wd.today i{border-color:var(--ink);border-width:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--soft);border-radius:16px}
.seg button{padding:10px 6px;border-radius:12px;font-weight:600;color:var(--muted);display:grid;gap:0;line-height:1.2}
.seg button b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;color:inherit}
.seg button span{font-size:.78rem}
.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.start{margin-top:12px;width:100%;height:62px;border-radius:18px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:1.08rem;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s}
.start:active{transform:scale(.985)}
.start svg{width:20px;height:20px}
.donebadge{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;color:var(--good);font-size:.93rem}
.donebadge svg{width:18px;height:18px}
.part{padding:16px 16px 6px}
.part+.part{border-top:1px solid var(--line)}
.part-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.part-h h3{font-size:1rem;font-weight:700;flex:1;min-width:0}
.part-h .t{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.moves{display:grid;margin-bottom:8px}
.mv{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:6px 0;text-align:left;width:100%}
.thumb{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--c) 13%,var(--card));overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.mv .nm{min-width:0;display:grid;line-height:1.25}
.mv .nm b{font-weight:600;font-size:.98rem}
.mv .nm span{font-size:.82rem;color:var(--muted)}
.mv .chev{color:var(--muted);width:18px;height:18px}
.round-note{font-size:.84rem;color:var(--muted);padding:0 0 12px}
.banner{padding:14px 16px;display:grid;gap:10px;margin-bottom:14px;border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--card))}
.banner p{font-size:.95rem}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:12px;padding:10px 16px;font-weight:600;font-size:.93rem;background:var(--soft);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn svg{width:18px;height:18px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.cal{padding:14px 14px 16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .d.on{background:var(--c);color:#fff;font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink);font-weight:700}
.cal .d.on.today{box-shadow:inset 0 0 0 2px var(--card),0 0 0 2px var(--ink)}
.lvls{display:grid;gap:10px}
.lvl{padding:14px 16px;display:grid;gap:10px}
.lvl-h{display:flex;align-items:center;gap:10px}
.lvl-h b{flex:1}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:6px;border-radius:4px;background:var(--soft)}
.bars i.on{background:var(--c)}
.lvl .cur{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left}
.lvl .cur span{font-size:.84rem;color:var(--muted)}
.hist{padding:4px 16px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;font-size:.93rem}
.hist div+div{border-top:1px solid var(--line)}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}

/* settings */
.set{padding:4px 16px}
.set>div{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0}
.set>div+div{border-top:1px solid var(--line)}
.set p{font-size:.86rem;color:var(--muted)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--soft);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .2);transition:left .15s}
.sw[aria-checked="true"]{background:var(--good)}
.sw[aria-checked="true"]::after{left:23px}
.note{font-size:.88rem;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.76rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--ink)}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgb(10 10 14 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .stage{border-radius:24px 24px 0 0;height:260px}
.sheet-body{padding:18px 20px;display:grid;gap:12px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:-.02em;line-height:1.1}
.cues{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.cues li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.cues li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);margin-top:8px}
.x{position:absolute;top:12px;right:12px;z-index:2;width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 4px rgb(0 0 0 / .15)}
.x svg{width:18px;height:18px}

/* stage */
.stage{position:relative;background:color-mix(in srgb,var(--c) 11%,var(--card));overflow:hidden;transition:background .4s}
.stage svg{display:block;width:100%;height:100%}

/* player */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-top{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.p-top .mid{flex:1;min-width:0;display:grid;gap:6px}
.p-top .row{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;font-weight:600}
.p-top .row span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.pbar{height:5px;border-radius:4px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s linear,background .4s}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.p-stage{flex:1 1 auto;min-height:0;margin:0 16px;border-radius:28px}
.p-info{padding:18px 20px 6px;max-width:560px;width:100%;margin:0 auto;display:grid;gap:4px}
.p-info .phase{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.p-info h2{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.05;letter-spacing:-.025em}
.p-info p{color:var(--muted);min-height:2.9em}
.p-time{padding:4px 20px 0;max-width:560px;width:100%;margin:0 auto;display:grid;gap:10px}
.p-time .num{font-family:var(--f-display);font-weight:700;font-size:4.6rem;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.p-time.rest .num{color:var(--muted)}
.tbar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--c);width:100%}
.p-ctrl{display:flex;justify-content:center;align-items:center;gap:26px;padding:18px 20px 22px}
.p-ctrl .big{width:76px;height:76px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center}
.p-ctrl .big svg{width:30px;height:30px}
.p-ctrl .sm{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.p-ctrl .sm svg{width:22px;height:22px}
.side-tag{position:absolute;top:14px;left:14px;padding:5px 12px;border-radius:999px;background:var(--card);font-weight:700;font-size:.85rem}
.confirm{position:absolute;inset:0;z-index:5;background:rgb(10 10 14 / .55);display:flex;align-items:flex-end;justify-content:center}
.confirm .box{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.confirm .box h3{font-family:var(--f-display);font-size:1.4rem}
.confirm .btn{justify-content:center;padding:14px}
.end{flex:1;overflow:auto;padding:28px 20px;max-width:560px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
.end>h2{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.035em}
.rate{padding:6px 16px}
.rate>div{padding:12px 0;display:grid;gap:8px}
.rate>div+div{border-top:1px solid var(--line)}
.rate .seg button{padding:9px 4px;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:calc(100% - 40px)}

@media (prefers-reduced-motion: reduce){.start,.sw,.sw::after,.stage,.pbar i{transition:none}}
</style>
</head>
<body>

<main class="app" id="view"></main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/></svg>Today</button>
    <button role="tab" data-tab="progress" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>Progress</button>
    <button role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Settings</button>
  </div>
</nav>

<div class="sheet-bg" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet-in"></div></div>
<div class="player" id="player" hidden></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const X=(...o)=>Object.assign({},...o);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dkey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const mondayOf=k=>{const d=fromKey(k);return addDays(k,-((d.getDay()+6)%7))};
const fmtTime=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const IC={
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l9 6-9 6zM16.5 6h2.5v12h-2.5z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6l-9 6 9 6zM5 6h2.5v12H5z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  voiceOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>',
  voiceOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 10l4 4M21 10l-4 4"/></svg>',
};

/* ================= the figure rig ================= */
/* angles in degrees: 0 = up, 90 = forward (right), 180 = down, 270 = back */
const L={torso:44,neck:15,head:11,ua:25,fa:23,th:31,sh:30};
const FLOOR=176;
const BASE={x:0,lift:0,t:0,h:0,ua1:172,fa1:170,ua2:188,fa2:190,th1:178,sh1:180,th2:182,sh2:180,flip:1,front:0};
const NUMK=Object.keys(BASE);
const dir=a=>{const r=a*Math.PI/180;return[Math.sin(r),-Math.cos(r)]};
const pt=(p,a,len)=>{const d=dir(a);return[p[0]+d[0]*len,p[1]+d[1]*len]};
const mix=(a,b,e)=>[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e];
function skel(P){
  const fr=clamp(Math.max(P.front,1-Math.abs(P.flip)),0,1), m=P.flip<0?-1:1;
  const hip=[0,0], chest=pt(hip,P.t,L.torso), shc=pt(hip,P.t,L.torso-5), head=pt(chest,P.t+P.h,L.neck);
  const pd=dir(P.t+90);
  const s1=[shc[0]+pd[0]*12*fr,shc[1]+pd[1]*12*fr], s2=[shc[0]-pd[0]*12*fr,shc[1]-pd[1]*12*fr];
  const hp1=[pd[0]*7*fr,pd[1]*7*fr], hp2=[-pd[0]*7*fr,-pd[1]*7*fr];
  const e1=pt(s1,P.ua1,L.ua),h1=pt(e1,P.fa1,L.fa),e2=pt(s2,P.ua2,L.ua),h2=pt(e2,P.fa2,L.fa);
  const k1=pt(hp1,P.th1,L.th),f1=pt(k1,P.sh1,L.sh),k2=pt(hp2,P.th2,L.th),f2=pt(k2,P.sh2,L.sh);
  const S={hip,chest,head,s1,s2,hp1,hp2,e1,h1,e2,h2,k1,f1,k2,f2};
  for(const k in S)S[k]=[S[k][0]*m,S[k][1]];
  S.fr=fr;return S;
}
const GROUND=[['hip',10],['chest',10],['head',7],['e1',4],['e2',4],['h1',4],['h2',4],['k1',5],['k2',5],['f1',5],['f2',5]];
function world(P){
  const S=skel(P);let my=-1e9;
  for(const[k,r]of GROUND)my=Math.max(my,S[k][1]+r);
  const ox=100+P.x, oy=FLOOR-my-P.lift, W={fr:S.fr,lift:P.lift};
  for(const k in S)if(Array.isArray(S[k]))W[k]=[S[k][0]+ox,S[k][1]+oy];
  return W;
}
const P2=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
const line=(pts,w,col)=>`<path d="M${pts.map(P2).join('L')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function drawFigure(W,acc){
  let s=`<ellipse cx="${W.hip[0].toFixed(1)}" cy="${FLOOR+2}" rx="${Math.max(12,30-W.lift*1.2)}" ry="3.2" fill="var(--fig)" opacity=".09"/>`;
  s+=line([W.s2,W.e2,W.h2],7,'var(--fig2)');
  s+=line([W.hp2,W.k2,W.f2],9,'var(--fig2)');
  s+=line([W.hip,W.chest],18+9*W.fr,acc);
  s+=line([W.hp1,W.k1,W.f1],9,'var(--fig)');
  s+=`<circle cx="${W.head[0].toFixed(1)}" cy="${W.head[1].toFixed(1)}" r="${L.head}" fill="var(--fig)"/>`;
  s+=line([W.s1,W.e1,W.h1],7,'var(--fig)');
  return s;
}
function drawProps(ex,W0,acc){
  const p=ex.prop;let s='';
  if(p==='wall'){const x=W0.h1[0]+5;s+=`<rect x="${x.toFixed(1)}" y="14" width="26" height="${FLOOR-14}" rx="3" fill="var(--prop)"/>`}
  if(p==='table'){const y=W0.h1[1]+4,x=W0.h1[0];s+=`<path d="M${x-6} ${y+6}V${FLOOR}M${x+42} ${y+6}V${FLOOR}" stroke="var(--fig2)" stroke-width="4" stroke-linecap="round"/><rect x="${(x-14).toFixed(1)}" y="${y.toFixed(1)}" width="64" height="7" rx="3" fill="var(--prop)"/>`}
  if(p==='chair'){const y=W0.hip[1]+10,x=W0.hip[0];s+=`<path d="M${x-18} ${y}V${FLOOR}M${x+16} ${y}V${FLOOR}M${x-20} ${y}V${y-42}" stroke="var(--fig2)" stroke-width="4" stroke-linecap="round"/><rect x="${(x-24).toFixed(1)}" y="${y.toFixed(1)}" width="46" height="7" rx="3" fill="var(--prop)"/>`}
  return s;
}
function drawAfter(ex,W,ball,acc){
  let s='';
  if(ex.prop==='towel'){const a=W.h1,b=W.h2,m=[(a[0]+b[0])/2,(a[1]+b[1])/2+5];s+=`<path d="M${P2(a)}Q${P2(m)} ${P2(b)}" fill="none" stroke="${acc}" stroke-width="5" stroke-linecap="round" opacity=".85"/>`}
  if(ball)s+=`<circle cx="${ball[0].toFixed(1)}" cy="${ball[1].toFixed(1)}" r="6" fill="${acc}"/>`;
  return s;
}

/* ================= animation engine ================= */
function prep(ex){
  if(ex._p)return ex._p;
  const kfs=ex.anim.map(k=>{const P=X(BASE,k);P.d=k.d??600;P.hold=k.hold??0;P.ball=k.ball;return P});
  kfs.forEach(k=>{k._w=world(k);if(k.ball)k._ball=k.ball==='h1'?k._w.h1:k.ball==='h2'?k._w.h2:[k._w.hip[0]+k.ball[0],k._w.hip[1]+k.ball[1]]});
  return ex._p={kfs,W0:kfs[0]._w,total:kfs.reduce((s,k)=>s+k.d+k.hold,0)||1};
}
const ease=e=>e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;
function frameAt(ex,t){
  const{kfs,total}=prep(ex);t=((t%total)+total)%total;
  for(let i=0;i<kfs.length;i++){
    const k=kfs[i];
    if(t<k.hold)return{W:k._w,ball:k._ball};
    t-=k.hold;
    if(t<k.d){
      const n=kfs[(i+1)%kfs.length],e=ease(t/k.d),P={};
      for(const key of NUMK)P[key]=k[key]+(n[key]-k[key])*e;
      let ball=null;
      if(k._ball&&n._ball){ball=mix(k._ball,n._ball,e);ball[1]-=Math.sin(e*Math.PI)*10}else if(k._ball)ball=k._ball;
      return{W:world(P),ball};
    }
    t-=k.d;
  }
  return{W:kfs[0]._w,ball:kfs[0]._ball};
}
const exColor=ex=>ex.path?PATHS[ex.path].c:WARM.includes(ex.id)?'#FF7A45':COOL.includes(ex.id)?'#7C5CFF':SKILLS[Object.keys(SKILLS).find(k=>SKILLS[k].ex.includes(ex.id))]?.c||'#7C5CFF';
const FLOORLINE=`<path d="M14 ${FLOOR+1}H186" stroke="var(--fig)" stroke-width="1.5" stroke-linecap="round" opacity=".18"/>`;
function scene(ex,t,mirror,acc){
  const{W,ball}=frameAt(ex,t),p=prep(ex);
  const inner=drawProps(ex,p.W0,acc)+drawFigure(W,acc)+drawAfter(ex,W,ball,acc);
  return FLOORLINE+(mirror?`<g transform="translate(200 0) scale(-1 1)">${inner}</g>`:inner);
}
function thumbSVG(ex){
  const p=prep(ex),i=ex.anim.length>1?1:0;
  const t=p.kfs.slice(0,i).reduce((s,q)=>s+q.d+q.hold,0)+p.kfs[i].hold/2;
  return `<svg viewBox="12 20 176 168" aria-hidden="true">${scene(ex,t,false,exColor(ex))}</svg>`;
}
const stages=new Set();
function mountStage(host,ex){
  host.innerHTML=`<svg viewBox="0 0 200 190" role="img" aria-label="${esc(ex.name)}" preserveAspectRatio="xMidYMid meet"><circle class="halo" cx="100" cy="104" r="72" fill="${exColor(ex)}" opacity=".14"/><g class="fig"></g></svg>`;
  host.style.setProperty('--c',exColor(ex));
  const st={host,g:host.querySelector('.fig'),ex,acc:0,mirror:false,paused:false};
  st.g.innerHTML=scene(ex,0,false,exColor(ex));
  stages.add(st);return st;
}
function setStage(st,ex){
  st.ex=ex;st.acc=0;st.mirror=false;
  const c=exColor(ex);st.host.style.setProperty('--c',c);
  st.host.querySelector('.halo').setAttribute('fill',c);
  st.host.querySelector('svg').setAttribute('aria-label',ex.name);
}
let lastFrame=performance.now();
function loop(now){
  const dt=Math.min(100,now-lastFrame);lastFrame=now;
  for(const st of stages){
    if(!st.host.isConnected){stages.delete(st);continue}
    if(st.paused)continue;
    st.acc+=dt;
    st.g.innerHTML=scene(st.ex,st.acc,st.mirror,exColor(st.ex));
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function skillFor(date=new Date()){return SKILL_BY_DAY[date.getDay()]}
function buildSession(len){
  const rounds=LENGTHS[len],skill=skillFor(),B=[];
  WARM.forEach((id,i)=>B.push({id,part:'warm',rest:i===WARM.length-1?10:0}));
  SKILLS[skill].ex.forEach(id=>B.push({id,part:'skill',rest:8}));
  for(let r=1;r<=rounds;r++)PATH_ORDER.forEach(p=>B.push({id:pathEx(p,state.levels[p]).id,part:'strength',path:p,round:r,rounds,rest:20}));
  COOL.forEach((id,i)=>B.push({id,part:'cool',rest:i===0?10:6}));
  B[B.length-1].rest=0;
  B.forEach(b=>b.work=WORK);
  return{len,skill,rounds,blocks:B};
}
const READY=5;
const sessionSecs=S=>READY+S.blocks.reduce((s,b)=>s+b.work+b.rest,0);

let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume?.()}catch{}}
function beep(kind){
  if(!state.beeps||!actx)return;
  try{
    const t=actx.currentTime;
    const blip=(at,f,len=.13,vol=.45)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+len);
      o.connect(g);g.connect(actx.destination);o.start(at);o.stop(at+len+.02)};
    if(kind==='tick')blip(t,880,.09,.35);
    if(kind==='go')blip(t,1320,.32,.5);
    if(kind==='stop'){blip(t,660,.14);blip(t+.17,520,.22)}
    if(kind==='switch'){blip(t,990,.1);blip(t+.14,990,.1)}
  }catch{}
}
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch{}}
if('speechSynthesis'in window){pickVoice();speechSynthesis.addEventListener?.('voiceschanged',pickVoice)}
function say(text){
  if(!state.voice||!('speechSynthesis'in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang=voice?.lang||'en-GB';u.rate=1;speechSynthesis.speak(u)}catch{}
}

    <div><span><b>Voice coach</b><p>Names each move and says when to switch sides.</p></span><button class="sw" role="switch" id="swVoice" aria-checked="${state.voice}" aria-label="Voice coach"></button></div>
    <div><span><b>Beeps</b><p>3-2-1 countdown, start and stop signals.</p></span><button class="sw" role="switch" id="swBeeps" aria-checked="${state.beeps}" aria-label="Beeps"></button></div>
    <div><span><b>Test sound</b><p>Check the volume before you start.</p></span><button class="btn" id="test">${IC.voiceOn}Test</button></div>
  </div></section>`;
  s+=`<section><div class="sec-h"><h2>App</h2></div><div class="card set">
    <div><span><b>Keep screen on</b><p>${wl?'The screen stays on during a workout.':'This browser can’t keep the screen on. Install Boing from Chrome for the best result.'}</p></span><span class="small" style="color:${wl?'var(--good)':'var(--warn)'};font-weight:700">${wl?'On':'Not available'}</span></div>
    ${standalone()?'<div><span><b>Installed</b><p>Boing is running as an app.</p></span></div>':installEvt?'<div><span><b>Install Boing</b><p>Adds an app icon and opens full screen.</p></span><button class="btn primary" id="install">Install</button></div>':'<div><span><b>Install Boing</b><p>In Chrome, open the ⋮ menu and choose “Install app” or “Add to Home screen”.</p></span></div>'}
  </div></section>`;
  s+=`<section><div class="sec-h"><h2>Backup</h2></div><div class="card set">
    <div><span><b>Save a backup</b><p>Downloads a small file with your history and levels.</p></span><button class="btn" id="backup">Save</button></div>
    <div><span><b>Restore</b><p>Load a backup file. This replaces what’s on this device.</p></span><button class="btn" id="restore">Restore</button></div>
  </div><p class="small muted" style="margin-top:10px">Everything is stored on this phone only. Nothing is sent anywhere.</p></section>`;
  s+=`<section><p class="note">Move within a pain-free range and stop if your back hurts. Get up from the floor slowly and pause if you feel dizzy. If dizziness keeps coming back, ask your GP about it.</p></section>`;
  return s;
}
function wireSettings(){
  $('#swVoice').onclick=()=>{state.voice=!state.voice;save();render()};
  $('#swBeeps').onclick=()=>{state.beeps=!state.beeps;save();render()};
  $('#test').onclick=()=>{unlockAudio();const v=state.voice,b=state.beeps;state.voice=state.beeps=true;say('Get ready.');[700,1700,2700].forEach(ms=>setTimeout(()=>{const bb=state.beeps;state.beeps=true;beep('tick');state.beeps=bb},ms));setTimeout(()=>{const bb=state.beeps;state.beeps=true;beep('go');state.beeps=bb},3700);state.voice=v;state.beeps=b};
  $('#install')&&($('#install').onclick=async()=>{installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;render()});
  $('#backup').onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`boing-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Backup saved to your downloads.');
  };
  $('#restore').onclick=()=>$('#restoreFile').click();
}
$('#restoreFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const s=JSON.parse(await f.text());if(!s||s.v!==2||!Array.isArray(s.history))throw 0;
    openSheet(`<div class="sheet-body" style="padding-top:28px"><h2>Restore this backup?</h2><p>It has ${s.history.length} sessions, the last on ${s.history.length?fromKey(s.history[s.history.length-1].date).toLocaleDateString('en-GB',{day:'numeric',month:'long'}):'—'}. It replaces the data on this phone.</p>
      <div class="row-btns"><button class="btn primary" id="doRestore">Restore</button><button class="btn" id="noRestore">Cancel</button></div></div>`);
    $('#doRestore').onclick=()=>{state=X(DEF(),s);save();closeSheet();render();toast('Backup restored.')};
    $('#noRestore').onclick=closeSheet;
  }catch{toast('That file isn’t a Boing backup.')}
});

/* sheet */
let sheetStage=null,lastFocus=null;
function openSheet(html){lastFocus=document.activeElement;$('#sheet-in').innerHTML=html;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheet-in').innerHTML='';sheetStage=null;lastFocus?.focus?.()}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
function openMove(id){
  const ex=EXM[id],c=exColor(ex);
  const meta=ex.path?`${PATHS[ex.path].name} · level ${ex.level} of ${MAXLVL[ex.path]}`:ex.sides?'20 seconds each side':'40 seconds';
  openSheet(`<button class="x" id="sheetX" aria-label="Close">${IC.close}</button><div class="stage" id="sheetStage"></div>
    <div class="sheet-body" style="--c:${c}"><span class="label" style="color:${c}">${esc(meta)}</span><h2>${esc(ex.name)}</h2>
    ${ex.needs?`<p class="small muted">Needs: ${esc(ex.needs.toLowerCase())}</p>`:''}${ex.floor?'<p class="small muted">On the floor: use a rug or carpet.</p>':''}
    <ul class="cues">${ex.cues.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>${ex.safety?`<p class="note">${esc(ex.safety)}</p>`:''}</div>`);
  sheetStage=mountStage($('#sheetStage'),ex);
  $('#sheetX').onclick=closeSheet;$('#sheetX').focus();
}

/* ================= player ================= */
let PL=null,tick=null,lastTick=0;
function startSession(){
  unlockAudio();goFullscreen();keepAwake();
  const S=buildSession(state.len);
  PL={S,i:0,phase:'ready',left:READY,dur:READY,paused:false,worked:0,startedAt:Date.now(),doneBlocks:new Set(),spokeSide:false,cueAt:0,cue:0};
  const p=$('#player');p.hidden=false;document.body.style.overflow='hidden';
  p.innerHTML=`<div class="p-top"><button class="icon-btn" id="pClose" aria-label="End workout">${IC.close}</button>
      <div class="mid"><div class="row"><span id="pPart"></span><span id="pTotal"></span></div><div class="pbar"><i id="pBar"></i></div></div>
      <button class="icon-btn" id="pVoice" aria-label="Voice coach">${state.voice?IC.voiceOn:IC.voiceOff}</button></div>
    <div class="stage p-stage" id="pStage"></div>
    <div class="p-info"><span class="phase" id="pPhase"></span><h2 id="pName"></h2><p id="pCue"></p></div>
    <div class="p-time" id="pTimeWrap"><span class="num" id="pTime"></span><div class="tbar"><i id="pTbar"></i></div></div>
    <div class="p-ctrl"><button class="sm" id="pPrev" aria-label="Previous move">${IC.prev}</button><button class="big" id="pPause" aria-label="Pause">${IC.pause}</button><button class="sm" id="pNext" aria-label="Next move">${IC.next}</button></div>
    <div class="confirm" id="pConfirm" hidden><div class="box"><h3>End this workout?</h3><p class="muted">What you’ve done so far still counts.</p>
      <button class="btn primary" id="cEnd">End and save</button><button class="btn" id="cKeep">Keep going</button></div></div>`;
  PL.stage=mountStage($('#pStage'),EXM[S.blocks[0].id]);
  $('#pClose').onclick=()=>{setPaused(true);$('#pConfirm').hidden=false};
  $('#cKeep').onclick=()=>{$('#pConfirm').hidden=true;setPaused(false)};
  $('#cEnd').onclick=()=>finishSession(false);
  $('#pPause').onclick=()=>setPaused(!PL.paused);
  $('#pNext').onclick=()=>jump(1);
  $('#pPrev').onclick=()=>jump(-1);
  $('#pVoice').onclick=()=>{state.voice=!state.voice;save();$('#pVoice').innerHTML=state.voice?IC.voiceOn:IC.voiceOff;if(!state.voice)try{speechSynthesis.cancel()}catch{}};
  showBlock(true);
  say(`Let’s go. Warm-up first: ${EXM[S.blocks[0].id].name}.`);
  clearInterval(tick);lastTick=performance.now();tick=setInterval(step,100);
}
const curB=()=>PL.S.blocks[PL.i];
function setPaused(v){
  PL.paused=v;PL.stage.paused=v;
  $('#pPause').innerHTML=v?IC.play:IC.pause;$('#pPause').setAttribute('aria-label',v?'Resume':'Pause');
  if(v)try{speechSynthesis.cancel()}catch{}
}
/* which block the screen shows: during rest, the next one */
function shownBlock(){return PL.phase==='rest'?PL.S.blocks[PL.i+1]:curB()}
function showBlock(newEx){
  const b=shownBlock(),ex=EXM[b.id],c=partColor(b);
  $('#player').style.setProperty('--c',c);
  if(newEx){setStage(PL.stage,ex);PL.stage.paused=PL.paused}
  const partTxt=b.part==='strength'?`Strength · round ${b.round} of ${b.rounds}`:b.part==='skill'?`Skill · ${SKILLS[PL.S.skill].name}`:PARTS[b.part].name;
  $('#pPart').textContent=partTxt;
  $('#pPhase').textContent=PL.phase==='ready'?'Get ready':PL.phase==='rest'?'Rest · up next':ex.sides?(PL.stage.mirror?'Other side':'First side'):b.part==='strength'?`${PATHS[b.path].name} · level ${ex.level}`:'Now';
  $('#pName').textContent=ex.name;
  PL.cue=0;PL.cueAt=0;$('#pCue').textContent=PL.phase==='rest'&&ex.safety?ex.safety:ex.cues[0];
  $('#pTimeWrap').classList.toggle('rest',PL.phase!=='work');
  updateTimes();
}
function remainingTotal(){
  let s=PL.left;const B=PL.S.blocks;
  if(PL.phase==='ready')s+=B.reduce((a,b)=>a+b.work+b.rest,0);
  else{if(PL.phase==='work')s+=curB().rest;for(let j=PL.i+1;j<B.length;j++)s+=B[j].work+B[j].rest}
  return s;
}
function updateTimes(){
  $('#pTime').textContent=PL.phase==='work'||PL.left>=60?fmtTime(PL.left):String(Math.max(0,Math.ceil(PL.left)));
  $('#pTbar').style.width=`${clamp(PL.left/PL.dur,0,1)*100}%`;
  const tot=sessionSecs(PL.S),rem=remainingTotal();
  $('#pTotal').textContent=`${fmtTime(rem)} left`;
  $('#pBar').style.width=`${clamp(1-rem/tot,0,1)*100}%`;
}
function step(){
  const now=performance.now(),dt=Math.min(.5,(now-lastTick)/1000);lastTick=now;
  if(!PL||PL.paused)return;
  const before=PL.left;PL.left-=dt;
  const crossed=n=>before>n&&PL.left<=n;
  if(PL.phase==='work'){
    PL.worked+=dt;
    const ex=EXM[curB().id];
    if(ex.sides&&!PL.spokeSide&&crossed(PL.dur/2)){PL.spokeSide=true;PL.stage.mirror=true;beep('switch');say('Switch sides');showBlock(false)}
    PL.cueAt+=dt;if(PL.cueAt>9){PL.cueAt=0;PL.cue=(PL.cue+1)%ex.cues.length;$('#pCue').textContent=ex.cues[PL.cue]}
  }
  for(const n of[3,2,1])if(crossed(n))beep('tick');
  if(PL.left<=0)advance();else updateTimes();
}
function startWork(){
  PL.phase='work';PL.left=PL.dur=curB().work;PL.spokeSide=false;
  PL.stage.mirror=false;beep('go');showBlock(true);
}
function advance(){
  const B=PL.S.blocks;
  if(PL.phase==='ready'){startWork();return}
  if(PL.phase==='work'){
    PL.doneBlocks.add(PL.i);beep('stop');
    if(PL.i>=B.length-1){finishSession(true);return}
    const b=curB(),nx=B[PL.i+1];
    if(b.rest>0){
      PL.phase='rest';PL.left=PL.dur=b.rest;showBlock(true);
      const intro=nx.part!==b.part?(nx.part==='skill'?`Skill of the day: ${SKILLS[PL.S.skill].name}. `:nx.part==='strength'?'Strength circuit. ':nx.part==='cool'?'Cool-down. ':''):nx.part==='strength'&&nx.round!==b.round?`Round ${nx.round}. `:'';
      say(`Rest. ${intro}Next: ${EXM[nx.id].name}.`);
    }else{PL.i++;startWork();say(EXM[curB().id].name)}
    return;
  }
  if(PL.phase==='rest'){PL.i++;startWork();say('Go')}
}
function jump(d){
  const B=PL.S.blocks;
  if(PL.phase==='ready'){if(d>0){startWork();say(EXM[curB().id].name)}return}
  if(PL.phase==='work'&&d>0)PL.doneBlocks.add(PL.i);
  let ni=PL.phase==='rest'&&d>0?PL.i+1:PL.i+d;
  if(PL.phase==='work'&&d<0&&PL.dur-PL.left>3)ni=PL.i; // restart current move
  if(ni>=B.length){finishSession(true);return}
  PL.i=clamp(ni,0,B.length-1);startWork();say(EXM[curB().id].name);
}
function finishSession(full){
  clearInterval(tick);
  const S=PL.S,mins=Math.max(1,Math.round(PL.worked/60+[...PL.doneBlocks].length*10/60));
  const did=new Set([...PL.doneBlocks].map(j=>S.blocks[j]).filter(b=>b.part==='strength').map(b=>b.path));
  const counts=PL.worked>=60;
  if(full)say('All done. Nice work!');else try{speechSynthesis.cancel()}catch{}
  releaseAwake();
  const p=$('#player');p.style.removeProperty('--c');
  p.innerHTML=`<div class="p-top"><span style="flex:1"></span><button class="icon-btn" id="eClose" aria-label="Close">${IC.close}</button></div>
    <div class="end"><span class="label">${full?'Session complete':'Session ended'}</span><h2>${full?'Nice work.':'Good effort.'}</h2>
      <div class="stats"><div class="card stat"><span class="label">Minutes</span><b>${mins}</b></div><div class="card stat"><span class="label">Moves done</span><b>${PL.doneBlocks.size}</b></div></div>
      ${did.size?`<div><div class="sec-h"><h2>How did the strength moves feel?</h2></div><div class="card rate">${PATH_ORDER.filter(p=>did.has(p)).map(p=>{const ex=pathEx(p,state.levels[p]);return`<div><b>${esc(ex.name)}</b><div class="seg" role="radiogroup" aria-label="${esc(ex.name)}" data-rate="${p}">${[['easy','Too easy'],['good','Just right'],['hard','Too hard']].map(([v,l])=>`<button role="radio" data-v="${v}" aria-checked="${v==='good'}">${l}</button>`).join('')}</div></div>`}).join('')}</div></div>`:''}
      ${counts?'':'<p class="note">Less than a minute of moving, so this one isn’t saved.</p>'}
      <button class="start" id="eSave">${counts?'Save and finish':'Close'}</button></div>`;
  document.querySelectorAll('[data-rate] button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x===b)))});
  const done=()=>{
    if(counts){
      const ratings={};document.querySelectorAll('[data-rate]').forEach(g=>{ratings[g.dataset.rate]=g.querySelector('[aria-checked="true"]').dataset.v});
      state.history.push({date:today(),mins,len:S.len,skill:S.skill,full,ratings,levels:X(state.levels)});
      for(const[p,r]of Object.entries(ratings)){
        if(r==='hard'){state.easy[p]=0;if(state.levels[p]>1)state.suggest[p]='down'}
        else if(r==='easy'){state.easy[p]=(state.easy[p]||0)+1;if(state.easy[p]>=2&&state.levels[p]<MAXLVL[p])state.suggest[p]='up'}
        else if(state.suggest[p]==='down')delete state.suggest[p];
      }
      save();
    }
    closePlayer();
  };
  $('#eSave').onclick=done;$('#eClose').onclick=done;
}
function closePlayer(){
  clearInterval(tick);releaseAwake();leaveFullscreen();
  $('#player').hidden=true;$('#player').innerHTML='';document.body.style.overflow='';PL=null;
  tab='today';render();scrollTo(0,0);
}

/* ================= boot ================= */
render();
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
